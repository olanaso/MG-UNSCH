<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Swipe between maps</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="../.env"></script>
    <script src="https://unpkg.com/maplibre-gl@2.1.6/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.1.6/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <style>
        body {
            overflow: hidden;
        }

        body * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
    <script
        src="https://rawcdn.githack.com/astridx/astridx.github.io/a9d7297a4fe1e3a4d7ebeb1e4e662fd1339ef3b5/maplibreexamples/plugins/maplibre-gl-compare.js"></script>
    <link rel="stylesheet"
        href="https://rawcdn.githack.com/astridx/astridx.github.io/a9d7297a4fe1e3a4d7ebeb1e4e662fd1339ef3b5/maplibreexamples/plugins/maplibre-gl-compare.css"
        type="text/css" />
    <div id="comparison-container">
        <div id="before" class="map"></div>
        <div id="after" class="map"></div>
    </div>
    <script>
        var beforeMap = new maplibregl.Map({
            container: "before",
            style:
                "https://api.maptiler.com/maps/hybrid/style.json?key=get_your_own_OpIi9ZULNHzrESv6T2vL",
            center: [-74.2238792,
            -13.1475099],
            zoom: 15,
        });

        var afterMap = new maplibregl.Map({
            container: "after",
            style: {
                version: 8,
                sources: {
                    'google-hybrid': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'],
                        tileSize: 256,
                        attribution: '&copy; Google'
                    }
                },
                layers: [{
                    id: 'google-hybrid',
                    type: 'raster',
                    source: 'google-hybrid'
                }]
            },
            center: [-74.2238792,
            -13.1475099],
            zoom: 15,
        });

        // A selector or reference to HTML element
        var container = "#comparison-container";

        var map = new maplibregl.Compare(afterMap, beforeMap, container, {
            // Set this to enable comparing two maps by mouse movement:
            // m ousemove: true
        });
    </script>
</body>

</html>
