<!DOCTYPE html>
<html lang="en">

<head>
    <title>Add a default marker</title>
    <meta property="og:description" content="Add a default marker to the map." />
    <meta property="og:category" content="Markers" />
    <meta property="og:order" content="1" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.css' />
    <link rel='stylesheet' href='https://unpkg.com/mapbox-gl@1.13.0/dist/mapbox-gl.css' />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
        }


        /* El punto rojo central */
        .marcador-pulso {
            width: 16px;
            height: 16px;
            background-color: blue;
            border-radius: 50%;
            position: relative;
            /* Opcional: un pequeño borde blanco para que resalte sobre el mapa satelital */
            border: 2px solid white;
        }

        /* La onda expansiva */
        .marcador-pulso::after {
            content: '';
            position: absolute;
            /* Centramos la onda con respecto al punto */
            top: -2px;
            left: -2px;
            width: 100%;
            height: 100%;
            background-color: blue;
            border-radius: 50%;
            z-index: -1;
            /* Asignamos la animación infinita */
            animation: animacion-pulso 1.5s ease-out infinite;
        }

        /* Definimos cómo crece y se desvanece la onda */
        @keyframes animacion-pulso {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(4);
                /* Crece hasta 4 veces su tamaño */
                opacity: 0;
                /* Desaparece suavemente */
            }
        }

        .formulario-manzana {
            min-width: 260px;
            max-height: 320px;
            overflow-y: auto;
        }

        .formulario-manzana label {
            display: block;
            margin: 6px 0 2px;
            font-weight: bold;
        }

        .formulario-manzana input {
            box-sizing: border-box;
            width: 100%;
            padding: 5px;
        }

        .formulario-manzana button {
            width: 100%;
            margin-top: 10px;
            padding: 7px;
            cursor: pointer;
        }

        .mensaje-manzana {
            margin-top: 6px;
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.mjs';

        window.mapboxgl = { ...maplibregl };
        await new Promise((resolve, reject) => {
            const pluginScript = document.createElement('script');
            pluginScript.src = 'https://aesqe.github.io/mapboxgl-minimap/mapboxgl-control-minimap.js';
            pluginScript.onload = resolve;
            pluginScript.onerror = reject;
            document.head.appendChild(pluginScript);
        });

        if (typeof window.mapboxgl.Minimap !== 'function') {
            window.mapboxgl.Minimap = class {
                constructor(options = {}) {
                    this.options = options;
                }

                onAdd (parentMap) {
                    this.parentMap = parentMap;
                    this.container = document.createElement('div');
                    this.container.id = this.options.id || 'mapa-miniatura';
                    this.container.className = 'mapboxgl-ctrl-minimap mapboxgl-ctrl';
                    this.container.style.width = this.options.width || '240px';
                    this.container.style.height = this.options.height || '160px';
                    parentMap.getContainer().appendChild(this.container);

                    this.minimap = new maplibregl.Map({
                        container: this.container,
                        style: this.options.style,
                        center: this.options.center || parentMap.getCenter(),
                        zoom: this.options.zoom || 5,
                        interactive: false,
                        attributionControl: false
                    });
                    this.sync = () => this.minimap.jumpTo({
                        center: parentMap.getCenter(),
                        zoom: Math.max(0, parentMap.getZoom() - 4)
                    });
                    parentMap.on('move', this.sync);
                    return this.container;
                }

                onRemove () {
                    this.parentMap.off('move', this.sync);
                    this.minimap.remove();
                    this.container.remove();
                }
            };
        }

        const map = new maplibregl.Map({
            container: 'map',
            center: [-76.320535481, -13.17694575],
            zoom: 12,
            // Definimos el estilo manualmente para usar tiles de satélite
            style: {
                'version': 8,
                'sources': {
                    'satelite-esri': {
                        'type': 'raster',
                        // URL pública de las imágenes satelitales de Esri
                        'tiles': [
                            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                        ],
                        'tileSize': 256,
                        'attribution': '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
                    }
                },
                'layers': [
                    {
                        'id': 'capa-satelite',
                        'type': 'raster',
                        'source': 'satelite-esri',
                        'minzoom': 0,
                        'maxzoom': 19
                    }
                ]
            }
        });

        async function cargarManzanas (ajustarVista = false) {
            const respuesta = await fetch('http://127.0.0.1:3000/api/v1/manzanas');
            if (!respuesta.ok) {
                throw new Error(`La API respondio con estado ${respuesta.status}`);
            }

            const resultado = await respuesta.json();
            const geojson = resultado.rows?.[0]?.geojson;

            if (!geojson || geojson.type !== 'FeatureCollection') {
                throw new Error('La respuesta no contiene un FeatureCollection en rows[0].geojson');
            }

            if (map.getSource('manzanas')) {
                map.getSource('manzanas').setData(geojson);
            } else {
                map.addSource('manzanas', {
                    type: 'geojson',
                    data: geojson
                });

                map.addLayer({
                    id: 'manzanas-relleno',
                    type: 'fill',
                    source: 'manzanas',
                    paint: {
                        'fill-color': '#f59e0b',
                        'fill-opacity': 0.35
                    }
                });

                map.addLayer({
                    id: 'manzanas-borde',
                    type: 'line',
                    source: 'manzanas',
                    paint: {
                        'line-color': '#7c2d12',
                        'line-width': 1.5
                    }
                });

                map.addLayer({
                    id: 'manzanas-etiquetas',
                    type: 'symbol',
                    source: 'manzanas',
                    layout: {
                        'text-field': ['to-string', ['get', 'manzana']],
                        'text-size': 12,
                        'text-font': ['Open Sans Bold'],
                        'text-anchor': 'center',
                        'text-allow-overlap': true,
                        'text-ignore-placement': true
                    },
                    paint: {
                        'text-color': '#ffffff',
                        'text-halo-color': '#7c2d12',
                        'text-halo-width': 1.5
                    }
                });

                map.on('click', 'manzanas-relleno', mostrarPopupManzana);

                map.on('mouseenter', 'manzanas-relleno', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });

                map.on('mouseleave', 'manzanas-relleno', () => {
                    map.getCanvas().style.cursor = '';
                });
            }

            if (ajustarVista && geojson.features.length > 0) {
                const limites = new maplibregl.LngLatBounds();
                geojson.features.forEach((feature) => {
                    const geometria = feature.geometry;
                    const coordenadas = geometria.type === 'Polygon'
                        ? geometria.coordinates.flat(1)
                        : geometria.coordinates.flat(2);

                    coordenadas.forEach(([longitud, latitud]) => {
                        limites.extend([longitud, latitud]);
                    });
                });
                map.fitBounds(limites, { padding: 40, maxZoom: 18 });
            }
        }

        function mostrarPopupManzana (evento) {
            const propiedades = evento.features?.[0]?.properties || {};
            const id = propiedades.id;
            const campos = Object.entries(propiedades)
                .filter(([clave]) => clave !== 'id')
                .map(([clave, valor]) => `
                    <label for="campo-${escaparHtml(clave)}">${escaparHtml(clave)}</label>
                    <input id="campo-${escaparHtml(clave)}" name="${escaparHtml(clave)}" value="${escaparHtml(valor)}">
                `)
                .join('');

            const popup = new maplibregl.Popup()
                .setLngLat(evento.lngLat)
                .setHTML(`
                    <form class="formulario-manzana" id="formulario-manzana">
                        ${campos}
                        <button type="submit">Guardar cambios</button>
                        <div class="mensaje-manzana" aria-live="polite"></div>
                    </form>
                `)
                .addTo(map);

            popup.getElement().querySelector('#formulario-manzana').addEventListener('submit', async (submitEvent) => {
                submitEvent.preventDefault();
                const formulario = submitEvent.currentTarget;
                const boton = formulario.querySelector('button');
                const mensaje = formulario.querySelector('.mensaje-manzana');
                const propiedadesActualizadas = Object.fromEntries(new FormData(formulario));

                boton.disabled = true;
                mensaje.textContent = '';

                try {
                    const respuesta = await fetch(`http://127.0.0.1:3000/api/v1/manzanas/${encodeURIComponent(id)}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ properties: propiedadesActualizadas })
                    });

                    if (!respuesta.ok) {
                        const error = await respuesta.json();
                        throw new Error(error.error || 'No se pudieron guardar los cambios');
                    }

                    await cargarManzanas();
                    popup.remove();
                } catch (error) {
                    mensaje.textContent = error.message;
                    boton.disabled = false;
                }
            });
        }

        function escaparHtml (valor) {
            return String(valor ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        map.on('load', () => {
            cargarManzanas(true).catch((error) => console.error('No se pudieron cargar las manzanas:', error));
        });

        map.addControl(new mapboxgl.Minimap({
            id: 'mapa-miniatura',
            width: '240px',
            height: '160px',
            style: map.getStyle(),
            center: [-74.2219243, -13.1477916],
            zoom: 5,
            lineColor: '#ffffff',
            lineWidth: 2,
            lineOpacity: 1,
            fillColor: '#1683d8',
            fillOpacity: 0.2,
            dragPan: false,
            scrollZoom: false,
            boxZoom: false,
            dragRotate: false,
            keyboard: false,
            doubleClickZoom: false,
            touchZoomRotate: false
        }), 'top-right');

        const miIcono = document.createElement('div');

        // 2. Darle estilo y asignar tu imagen
        // 1. Crear el elemento HTML para el marcador
        const elementoMarcador = document.createElement('div');
        elementoMarcador.className = 'marcador-pulso';

        const marker = new maplibregl.Marker({
            element: elementoMarcador,
            anchor: 'bottom' // Hace que la parte inferior de la imagen toque la coordenada exacta
        })
            .setLngLat([-74.2219,
            -13.1477916])
            .addTo(map);



    </script>
</body>

</html>
