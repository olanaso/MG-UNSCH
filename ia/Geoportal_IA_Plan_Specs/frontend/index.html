<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Geoportal de lugares</title>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="app-shell">
    <header class="border-b border-slate-200 bg-white px-5 py-4">
      <div class="mx-auto flex max-w-screen-2xl flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-xs font-bold uppercase tracking-widest text-teal-700">Laboratorio SIG Web</p>
          <h1 class="text-2xl font-bold">Geoportal de lugares</h1>
          <p class="text-sm text-slate-600">Explora y registra puntos de interés en Lima.</p>
        </div>
        <span id="estado" role="status" aria-live="polite" class="rounded-lg bg-teal-50 px-4 py-2 text-sm text-teal-900">Conectando…</span>
      </div>
    </header>
    <main class="main-layout mx-auto w-full max-w-screen-2xl">
      <aside class="sidebar border-r border-slate-200 bg-white p-5">
        <section aria-labelledby="filtros-title" class="mb-7">
          <h2 id="filtros-title" class="text-lg font-bold">Explorar</h2>
          <p class="mt-1 text-sm text-slate-600">Filtra lugares o busca cerca del centro del mapa.</p>
          <label class="mt-4 block text-sm font-semibold" for="mapa-base">Mapa base</label>
          <select id="mapa-base" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2.5"></select>
          <label class="mt-4 block text-sm font-semibold" for="filtro">Categoría</label>
          <select id="filtro" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2.5">
            <option value="">Todas</option><option value="salud">Salud</option>
            <option value="educacion">Educación</option><option value="cultura">Cultura</option><option value="otro">Otro</option>
          </select>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button id="actualizar" type="button" class="rounded-lg bg-slate-800 px-3 py-2.5 text-sm font-semibold text-white hover:bg-slate-700">Actualizar</button>
            <button id="cercanos" type="button" disabled class="rounded-lg bg-teal-700 px-3 py-2.5 text-sm font-semibold text-white hover:bg-teal-600">A 2 km</button>
          </div>
          <ul id="lista" aria-label="Lugares encontrados" class="mt-4 space-y-2 text-sm"></ul>
        </section>
        <section aria-labelledby="crear-title" class="border-t border-slate-200 pt-5">
          <h2 id="crear-title" class="text-lg font-bold">Registrar un lugar</h2>
          <p class="mt-1 text-sm text-slate-600">Haz clic en un espacio libre del mapa para elegir la posición.</p>
          <form id="formulario" class="mt-4 space-y-3">
            <label class="block text-sm font-semibold">Nombre
              <input name="nombre" required maxlength="120" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 font-normal" placeholder="Ej. Museo local">
            </label>
            <label class="block text-sm font-semibold">Categoría
              <select name="categoria" required class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2.5 font-normal">
                <option value="cultura">Cultura</option><option value="salud">Salud</option>
                <option value="educacion">Educación</option><option value="otro">Otro</option>
              </select>
            </label>
            <label class="block text-sm font-semibold">Descripción
              <input name="descripcion" maxlength="500" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 font-normal" placeholder="Opcional">
            </label>
            <div class="grid grid-cols-2 gap-2">
              <label class="block text-sm font-semibold">Longitud
                <input name="longitud" type="number" step="any" min="-180" max="180" required class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 font-normal">
              </label>
              <label class="block text-sm font-semibold">Latitud
                <input name="latitud" type="number" step="any" min="-90" max="90" required class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 font-normal">
              </label>
            </div>
            <button id="guardar" class="w-full rounded-lg bg-teal-700 px-4 py-3 font-semibold text-white hover:bg-teal-600" type="submit">Guardar en PostGIS</button>
            <label class="flex items-center gap-2 text-sm text-slate-600">
              <input id="sonido" type="checkbox" checked class="accent-teal-700"> Sonido al guardar
            </label>
          </form>
        </section>
      </aside>
      <section class="map-wrap" aria-label="Mapa de lugares">
        <div id="mapa"></div>
        <div id="estado-mapa" role="status" class="map-hint">Cargando mapa…</div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
