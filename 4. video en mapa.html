<!DOCTYPE html>
<html lang="en">

<head>
    <title>Add a video</title>
    <meta property="og:description" content="Display a video on top of a satellite raster baselayer." />
    <meta property="og:category" content="Raster & Imagery" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.css' />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.mjs';

        const videoStyle = {
            'version': 8,
            'sources': {

                'satellite': {
                    'type': 'raster',
                    'url': 'https://api.maptiler.com/tiles/satellite/tiles.json?key=get_your_own_OpIi9ZULNHzrESv6T2vL',
                    'tileSize': 256
                },

                'video': {
                    'type': 'video',
                    'urls': [
                        'https://static-assets.mapbox.com/mapbox-gl-js/drone.mp4',
                        'https://static-assets.mapbox.com/mapbox-gl-js/drone.webm'
                    ],
                    'coordinates': [
                        [-122.51596391201019, 37.56238816766053],
                        [-122.51467645168304, 37.56410183312965],
                        [-122.51309394836426, 37.563391708549425],
                        [-122.51423120498657, 37.56161849366671]
                    ]
                },

                'video-peru': {
                    'type': 'video',
                    'urls': [
                        'https://samplelib.com/mp4/sample-5s.mp4'

                    ],
                    'coordinates':

                        [
                            [
                                -77.04320576986032,
                                -9.253443183484706
                            ],
                            [
                                -74.77105963919028,
                                -9.25335680556654
                            ],
                            [
                                -74.77107639220704,
                                -10.713687150753074
                            ],
                            [
                                -77.04321198299961,
                                -10.71365611015922
                            ],

                        ]
                },

                'video-ayacucho': {
                    'type': 'video',
                    'urls': [
                        'https://samplelib.com/mp4/sample-20s-720p.mp4'
                    ],
                    'coordinates': [
                        [-74.35, -13.05],
                        [-74.10, -13.05],
                        [-74.10, -13.28],
                        [-74.35, -13.28]
                    ]
                }
            },
            'layers': [
                {
                    'id': 'background',
                    'type': 'background',
                },
                {
                    'id': 'satellite',
                    'type': 'raster',
                    'source': 'satellite'
                },
                {
                    'id': 'video',
                    'type': 'raster',
                    'source': 'video'
                },
                {
                    'id': 'video-peru',
                    'type': 'raster',
                    'source': 'video-peru'
                },
                {
                    'id': 'video-ayacucho',
                    'type': 'raster',
                    'source': 'video-ayacucho'
                }
            ]
        };

        const map = new maplibregl.Map({
            container: 'map',
            minZoom: 0,
            zoom: 11,
            center: [-74.218, -13.163],

            style: videoStyle
        });

        let playingVideo = true;

        map.on('click', () => {
            playingVideo = !playingVideo;

            if (playingVideo) map.getSource('video').play();
            else map.getSource('video').pause();
        });
    </script>
</body>

</html>
